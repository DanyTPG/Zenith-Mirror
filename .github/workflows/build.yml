name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  LDFLAGS: -s -w

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: linux, goarch: arm, goarm: "7", ext: "" }
          # Android (Termux)
          - { goos: android, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags="$LDFLAGS" -o zenith-mirror-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-mirror-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zenith-mirror-*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Recreate release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: latest
          prerelease: false
          make_latest: true
          body: |
            Automated cross-platform build of master @ ${{ github.sha }}
            Targets: linux/amd64, linux/arm64, linux/armv7, android/arm64 (Termux), windows/amd64
          files: dist/*
