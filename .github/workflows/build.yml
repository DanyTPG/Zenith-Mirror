name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o zenith-mirror .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-mirror-linux-amd64
          path: zenith-mirror
          retention-days: 30

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: false
          make_latest: true
          body: |
            Automated build of master @ ${{ github.sha }}
            Download: https://github.com/DanyTPG/Zenith-Mirror/releases/latest/download/zenith-mirror
          files: zenith-mirror
