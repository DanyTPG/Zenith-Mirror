name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o zenith-mirror .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-mirror-linux-amd64
          path: zenith-mirror
          retention-days: 30

      - name: Push binary to bin branch
        run: |
          git clone --single-branch --branch bin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} binrepo 2>/dev/null || (git init binrepo && cd binrepo && git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }})
          cd binrepo
          git checkout -b bin 2>/dev/null || git checkout bin
          cp ../zenith-mirror .
          git config user.name "ci-bot"
          git config user.email "ci@noreply.github.com"
          git add zenith-mirror
          git commit -m "build ${{ github.sha }}" || exit 0
          git push origin bin --force
